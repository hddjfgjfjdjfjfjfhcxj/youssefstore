<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر يوسف - متجر الأناقة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0c0d0f;
            color: #ffffff;
            direction: rtl;
        }

        header {
            background-color: #1a1c22;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #282b33;
        }

        h1 {
            margin: 0;
            color: #e50914;
            font-size: 2.5rem;
            font-weight: 900;
        }

        #products-container {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            min-height: 50vh;
        }

        .product-card {
            background-color: #1a1c22;
            border-radius: 12px;
            overflow: hidden;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-image {
            width: 100%;
            height: 300px;
            background-color: #282b33;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            margin: 0 0 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .product-price {
            font-size: 1.3rem;
            color: #e50914;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .buy-button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #e50914;
            color: #fff;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .buy-button:hover {
            background-color: #ff0f1e;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 2px solid #282b33;
            color: #555;
            background-color: #1a1c22;
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر يوسف</h1>
    </header>

    <div id="products-container">
        <div class="product-card">
            <div class="product-image">
                <img src="shirt.avif" alt="قميص بولو رجالي">
            </div>
            <div class="product-details">
                <h3 class="product-title">قميص بولو رجالي صيفي عصري</h3>
                <p class="product-price">569.70 ج.م.</p>
                <button class="buy-button">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 متجر يوسف الحقيقي. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
