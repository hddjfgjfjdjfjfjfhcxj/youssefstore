<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر يوسف - متجر الأناقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Cairo', sans-serif; background-color: #0c0d0f; color: #ffffff; text-align: center; }
        header { background-color: #1a1c22; padding: 20px; border-bottom: 2px solid #282b33; }
        h1 { color: #e50914; margin: 0; }
        #products-container { padding: 40px 20px; display: flex; justify-content: center; }
        .product-card { background-color: #1a1c22; border-radius: 12px; overflow: hidden; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .product-image { width: 100%; height: 350px; background-color: #282b33; display: flex; align-items: center; justify-content: center; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-details { padding: 20px; }
        .product-title { font-size: 1.2rem; margin: 0 0 10px; }
        .product-price { font-size: 1.3rem; color: #e50914; font-weight: 900; margin-bottom: 15px; }
        .buy-button { width: 100%; padding: 12px; background-color: #e50914; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>متجر يوسف</h1>
    </header>

    <div id="products-container">
        <div class="product-card">
            <div class="product-image">
                <!-- تم وضع صورة القميص هنا -->
                <img src="e8eb38e8-290b-49de-a1f9-9462ec546179.avif" alt="قميص بولو">
            </div>
            <div class="product-details">
                <h3 class="product-title">قميص بولو رجالي صيفي عصري</h3>
                <p class="product-price">569.70 ج.م.</p>
                <button class="buy-button">إضافة للسلة</button>
            </div>
        </div>
    </div>

</body>
</html>
